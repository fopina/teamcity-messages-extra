# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: publish

on:
  release:
    types: [created]

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  publish:
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name }}
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        pip install uv
        uv sync --dev
    - name: Set release version
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        uv run python - <<'PY'
        import os
        import re
        from pathlib import Path
        from packaging.version import Version

        version = str(Version(os.environ['RELEASE_TAG']))
        path = Path('teamcity_extra/__init__.py')
        source, count = re.subn(r'^__version__ = .*$', f'__version__ = {version!r}', path.read_text(), flags=re.MULTILINE)
        if count != 1:
            raise SystemExit('Expected exactly one __version__ assignment')
        path.write_text(source)
        PY
    - name: Build and verify
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        uv build
        uv run twine check dist/*
        uv run python - <<'PY'
        import os
        from email.parser import BytesParser
        from pathlib import Path
        from zipfile import ZipFile
        from packaging.version import Version

        wheel, = Path('dist').glob('*.whl')
        with ZipFile(wheel) as archive:
            metadata_path, = (name for name in archive.namelist() if name.endswith('.dist-info/METADATA'))
            metadata = BytesParser().parsebytes(archive.read(metadata_path))
        expected = Version(os.environ['RELEASE_TAG'])
        if Version(metadata['Version']) != expected:
            raise SystemExit(f"Built version {metadata['Version']} does not match release {expected}")
        PY
    - name: Publish
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        uv run twine upload dist/*
